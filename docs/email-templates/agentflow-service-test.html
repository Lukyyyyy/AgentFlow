<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentFlow 邮件服务测试</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9;padding:32px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',Arial,sans-serif;">
        <tr>
          <td style="padding:36px 40px 0 40px;border:1px solid #e2e8f0;border-radius:12px 12px 0 0;border-bottom:none;">
            <span style="font-size:20px;font-weight:bold;color:#4f6bed;">AgentFlow</span>
            <span style="font-size:13px;color:#94a3b8;margin-left:8px;">AI 工作流编排平台</span>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 40px 24px 40px;border:1px solid #e2e8f0;border-top:none;border-radius:0 0 12px 12px;">
            <p style="margin:0 0 8px 0;font-size:14px;line-height:24px;color:#526071;">这是一封邮件服务测试邮件。</p>
            <p style="margin:0;font-size:14px;line-height:24px;color:#526071;">收到此邮件说明 AgentFlow 邮件服务配置成功，可以正常投递系统邮件。</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 40px 32px 40px;">
            <p style="margin:0;font-size:12px;line-height:20px;color:#94a3b8;">此邮件由 AgentFlow 系统自动发送，请勿直接回复。</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
