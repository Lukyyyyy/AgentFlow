server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: AgentFlow
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
    livereload:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      password: ${REDIS_PASSWORD:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:agentflow}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  mail:
    # 邮件服务（邮箱注册验证码）。MAIL_HOST 留空时注册功能不可用并返回 503
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  ai:
    openai:
      # 占位配置，实际使用时通过节点配置动态指定
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: https://api.openai.com

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.agentflow.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  info:
    title: AgentFlow API
    description: AgentFlow AI 工作流编排平台 API
    version: 1.0.0

# MinIO 配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: agentflow
  publicUrl: ${MINIO_PUBLIC_URL:http://localhost:9000}
  presignedUrlExpirySeconds: ${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:604800}

# AgentFlow 配置
agentflow:
  auth:
    # 本地开发未配置 JWT_SECRET 时会自动生成临时强密钥；生产环境请务必显式配置
    jwt-secret: ${JWT_SECRET:}
    access-token-expiration-minutes: 120
    refresh-token-expiration-hours: 168
  # 默认普通账户（首次启动时写入 user 表；留空则只能通过邮箱验证注册）
  default-username: ${APP_AUTH_DEFAULT_USERNAME:admin}
  default-password: ${APP_AUTH_DEFAULT_PASSWORD:admin123}
  default-email: ${APP_AUTH_DEFAULT_EMAIL:admin@example.com}
  mail:
    # 发送通道: smtp(默认) | tencent-ses
    provider: ${MAIL_PROVIDER:smtp}
    # SMTP 发件人地址（如 AgentFlow <no-reply@example.com>），留空则使用 spring.mail.username
    from: ${MAIL_FROM:}
    tencent-ses:
      # 腾讯云 SES API 模板发送（provider=tencent-ses 时必填）
      secret-id: ${TENCENT_SES_SECRET_ID:}
      secret-key: ${TENCENT_SES_SECRET_KEY:}
      region: ${TENCENT_SES_REGION:ap-hongkong}
      # 发信地址，支持别名格式：AgentFlow <no-reply@example.com>
      from-address: ${TENCENT_SES_FROM_ADDRESS:}
      # 已审核通过的验证码模板 ID（发信模板列表中查看）
      verification-template-id: ${TENCENT_SES_VERIFICATION_TEMPLATE_ID:0}
  skills:
    path: skills
